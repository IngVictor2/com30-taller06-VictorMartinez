<div class="shell">
  <header class="cabecera">
    <div class="cabecera-contenido">
      <div class="marca">
        <div class="logo" aria-hidden="true">TI</div>
        <div>
          <p class="eyebrow">COM30 · Taller 06 · 2026-III</p>
          <h1>Mesa de Ayuda TI</h1>
          <p class="subtitulo">Registro y gestión de solicitudes de soporte</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <strong>{{ total() }}</strong>
          <span>Solicitudes</span>
        </div>
        <div class="stat">
          <strong>{{ pendientes() }}</strong>
          <span>Pendientes</span>
        </div>
      </div>
    </div>
  </header>

  <main class="contenido">
    <app-solicitud-form />
    <app-solicitud-list />
  </main>

  <footer class="pie">
    <span>Escenario E1 · Formularios reactivos con Angular</span>
    <span>Datos en memoria · signals + computed</span>
  </footer>
</div>
